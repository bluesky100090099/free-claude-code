# Quality gate for reels_autopilot: lint + unit tests + a real ffmpeg render.
name: Reels Autopilot CI

on:
  push:
    paths: ["reels_autopilot/**", ".github/workflows/reels-autopilot*.yml"]
  pull_request:
    paths: ["reels_autopilot/**", ".github/workflows/reels-autopilot*.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: reels_autopilot

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reels_autopilot/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install numpy requests "opencv-python-headless<5" google-genai google-api-python-client google-auth pytest ruff
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
      - name: Gemini smoke test (only when the secret exists)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        if: env.GEMINI_API_KEY != ''
        run: |
          ffmpeg -v error -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=40" \
            -f lavfi -i "sine=f=300:d=40" -shortest -c:v libx264 -preset ultrafast -c:a aac smoke.mp4
          python -m reels make smoke.mp4 -n 1 -d 10 --picker gemini --no-captions -o smoke_out
